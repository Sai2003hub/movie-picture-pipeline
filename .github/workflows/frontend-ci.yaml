name: Frontend Continuous Integration
on:
  workflow_dispatch: {}
  pull_request:
    branches:
      - main
    paths:
      - "starter/frontend/**"
defaults:
  run:
    working-directory: starter/frontend
env:
  NODE_VERSION: "18"
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: starter/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: starter/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run test suite
        run: npm test
        env:
          CI: true
  build:
    name: Build
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: starter/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run test suite
        run: npm test
        env:
          CI: true
      - name: Build Docker image
        working-directory: starter/frontend
        run: |
          docker build \
            --build-arg=REACT_APP_MOVIE_API_URL=http://localhost:5000 \
            --tag=mp-frontend:${{ github.sha }} \
            .
